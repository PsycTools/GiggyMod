                // Sorting Logic
                const featured = apps.filter(a => a.isFeatured).slice(0, 4);
                const latest = [...apps].sort((a,b) => b.timestamp - a.timestamp).slice(0, 8);
                const popular = [...apps].sort((a,b) => b.downloads - a.downloads).slice(0, 8);

                const cardHTML = (a) => `
                    <div class="app-card ripple" data-id="${a.id}">
                        <div class="card-badge">MOD</div>
                        <img data-src="${a.icon}" class="card-icon lazy" alt="${a.name}">
                        <div class="card-title">${a.name}</div>
                        <div class="card-meta">
                            <i class="fa-solid fa-star" style="color:#FFD700; font-size:0.7rem"></i> ${a.rating}
                            <span style="margin:0 4px">•</span> ${a.size}
                        </div>
                    </div>
                `;

                return `
                    <div class="container fade-in">
                        <!-- Featured -->
                        <div class="section-head">
                            <h2 class="section-title">Editor's Choice</h2>
                        </div>
                        <div class="app-grid" style="margin-bottom: 30px">
                            ${featured.map(cardHTML).join('')}
                        </div>

                        <!-- Native Ad Banner Placeholder -->
                        <div class="skeleton" style="height: 80px; width:100%; margin: 20px 0; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#999;">
                            Native Ad Space
                        </div>

                        <!-- Latest -->
                        <div class="section-head">
                            <h2 class="section-title">Latest Updates</h2>
                            <a href="#latest" class="view-all">See All</a>
                        </div>
                        <div class="app-grid" style="margin-bottom: 30px">
                            ${latest.map(cardHTML).join('')}
                        </div>

                        <!-- Popular -->
                        <div class="section-head">
                            <h2 class="section-title">Trending Now</h2>
                            <a href="#popular" class="view-all">See All</a>
                        </div>
                        <div class="app-grid">
                            ${popular.map(cardHTML).join('')}
                        </div>
                        <div class="spacer"></div>
                    </div>
                `;
            }

            renderDetails(app) {
                document.title = `${app.name} MOD APK ${app.version} Download - GiggyMod`;
                
                const features = app.modFeatures || ["Premium Unlocked", "No Ads"];
                const screenshots = app.screenshots || [];

                return `
                    <div class="fade-in">
                        <div class="hero-section">
                            <img src="${app.icon}" class="hero-icon" alt="${app.name}">
                            <h1 class="hero-title">${app.name}</h1>
                            <div class="hero-tags">
                                <span class="tag">v${app.version}</span>
                                <span class="tag">${app.size}</span>
                                <span class="tag mod">MOD Unlocked</span>
                            </div>
                            <div style="font-size:0.85rem; color:var(--text-sub)">
                                ${app.downloads.toLocaleString()} Downloads • Updated ${new Date(app.timestamp).toLocaleDateString()}
                            </div>
                        </div>

                        <div class="container" style="padding-bottom: 100px;">
                            
                            <!-- Features -->
                            <div class="feature-box">
                                <h3><i class="fa-solid fa-bolt"></i> MOD Features</h3>
                                <ul class="feature-list">
                                    ${features.map(f => `<li>${f}</li>`).join('')}
                                </ul>
                            </div>

                            <!-- Description -->
                            <h3 style="margin-bottom:10px; font-family:var(--font-head)">About this game</h3>
                            <div class="desc-text collapsed" id="descText">
                                ${app.description || "No description available."}
                                <br><br>
                                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.
                            </div>
                            <span class="read-more-btn" id="readMore">Read more</span>

                            <!-- Screenshots -->
                            <h3 style="margin-bottom:15px; font-family:var(--font-head)">Screenshots</h3>
                            <div class="scroller">
                                ${screenshots.map(src => `<img src="${src}" class="iv-trigger" loading="lazy">`).join('')}
                            </div>

                            <!-- Ad Spacer -->
                            <div class="skeleton" style="height: 100px; margin-top:30px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#999;">
                                Advertisement
                            </div>
                        </div>

                        <!-- Sticky Footer -->
                        <div class="sticky-footer">
                            <div style="display:flex; flex-direction:column;">
                                <span style="font-weight:700; font-size:1.1rem">${app.size}</span>
                                <span style="font-size:0.75rem; color:var(--text-sub)">Safe & Secure</span>
                            </div>
                            <button class="dl-btn ripple" id="initDownload" data-link="${app.downloadUrl}">
                                Download <i class="fa-solid fa-download"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            renderListing(title, apps) {
                if(apps.length === 0) return `<div class="container error-state"><i class="fa-regular fa-folder-open" style="font-size:3rem; margin-bottom:10px"></i><p>No results found.</p></div>`;

                return `
                    <div class="container fade-in">
                        <div class="section-head">
                            <h2 class="section-title">${title}</h2>
                        </div>
                        <div class="app-grid">
                            ${apps.map(a => `
                                <div class="app-card ripple" data-id="${a.id}">
                                    <div class="card-badge">MOD</div>
                                    <img data-src="${a.icon}" class="card-icon lazy">
                                    <div class="card-title">${a.name}</div>
                                    <div class="card-meta">
                                        <i class="fa-solid fa-star" style="color:#FFD700; font-size:0.7rem"></i> ${a.rating}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="spacer"></div>
                    </div>
                `;
            }

            // --- Functionality ---
            lazyLoadImages() {
                const images = document.querySelectorAll('.lazy');
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const img = entry.target;
                            img.src = img.dataset.src;
                            img.classList.remove('lazy');
                            obs.unobserve(img);
                        }
                    });
                });
                images.forEach(img => observer.observe(img));
            }

            attachDynamicListeners() {
                // Card Clicks
                document.querySelectorAll('.app-card').forEach(card => {
                    card.addEventListener('click', () => {
                        window.location.hash = `#details?id=${card.dataset.id}`;
                    });
                });

                // Read More
                const rm = document.getElementById('readMore');
                if (rm) {
                    rm.addEventListener('click', () => {
                        document.getElementById('descText').classList.toggle('collapsed');
                        rm.textContent = rm.textContent === 'Read more' ? 'Show less' : 'Read more';
                    });
                }

                // Image Viewer Triggers
                document.querySelectorAll('.iv-trigger').forEach(img => {
                    img.addEventListener('click', () => {
                        const modal = document.getElementById('imgModal');
                        document.getElementById('ivImage').src = img.src;
                        modal.classList.add('active');
                    });
                });

                // Download Flow
                const dlBtn = document.getElementById('initDownload');
                if (dlBtn) {
                    dlBtn.addEventListener('click', () => {
                        this.startDownloadFlow(dlBtn.dataset.link);
                    });
                }
            }

            startDownloadFlow(url) {
                const modal = document.getElementById('dlModal');
                const timerEl = document.getElementById('dlTimer');
                const finalBtn = document.getElementById('finalDlBtn');
                let timeLeft = 5;

                modal.classList.add('active');
                
                // Reset
                timerEl.textContent = timeLeft;
                finalBtn.style.opacity = '0.5';
                finalBtn.style.pointerEvents = 'none';

                const interval = setInterval(() => {
                    timeLeft--;
                    timerEl.textContent = timeLeft;
                    if(timeLeft <= 0) {
                        clearInterval(interval);
                        timerEl.textContent = "Ready!";
                        finalBtn.style.opacity = '1';
                        finalBtn.style.pointerEvents = 'all';
                        finalBtn.onclick = () => {
                            window.open(url, '_blank');
                            modal.classList.remove('active');
                        };
                    }
                }, 1000);
            }

            setupGlobalListeners() {
                // Sidebar
                document.getElementById('menuBtn').onclick = () => this.toggleSidebar(true);
                document.getElementById('closeSidebar').onclick = () => this.toggleSidebar(false);
                document.getElementById('backdrop').onclick = () => this.toggleSidebar(false);
                document.getElementById('themeToggle').onclick = () => this.toggleTheme();

                // Search
                const sModal = document.getElementById('searchModal');
                const sInput = document.getElementById('searchInput');
                
                document.getElementById('searchBtn').onclick = () => {
                    sModal.classList.add('active');
                    setTimeout(() => sInput.focus(), 300);
                };
                document.getElementById('closeSearch').onclick = () => sModal.classList.remove('active');

                // Search Debounce
                let timeout;
                sInput.addEventListener('input', (e) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => this.performSearch(e.target.value), 300);
                });

                // Filter
                document.getElementById('openFilter').onclick = () => {
                    document.getElementById('filterBackdrop').classList.add('active');
                    document.getElementById('filterSheet').classList.add('active');
                };
                document.getElementById('filterBackdrop').onclick = () => {
                    document.getElementById('filterBackdrop').classList.remove('active');
                    document.getElementById('filterSheet').classList.remove('active');
                };
                
                // Chip Selection
                document.querySelectorAll('.chip').forEach(chip => {
                    chip.onclick = () => {
                        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
                        chip.classList.add('selected');
                        store.filter.sort = chip.dataset.sort;
                    };
                });

                document.getElementById('applyFilter').onclick = () => {
                    document.getElementById('filterBackdrop').classList.remove('active');
                    document.getElementById('filterSheet').classList.remove('active');
                    // Logic to re-sort search results would go here in a full app
                    if(sInput.value) this.performSearch(sInput.value);
                };

                // Close Modals
                document.getElementById('imgModal').onclick = () => document.getElementById('imgModal').classList.remove('active');
                
                // Close DL Modal on click outside card
                document.getElementById('dlModal').addEventListener('click', (e) => {
                    if(e.target === document.getElementById('dlModal')) {
                        document.getElementById('dlModal').classList.remove('active');
                    }
                });
            }

            performSearch(term) {
                const results = document.getElementById('searchResults');
                if(term.length < 2) {
                    results.innerHTML = ''; 
                    return;
                }

                const regex = new RegExp(`(${term})`, 'gi');
                let hits = store.apps.filter(a => a.name.toLowerCase().includes(term.toLowerCase()));

                // Sort based on filter
                if(store.filter.sort === 'popular') hits.sort((a,b) => b.downloads - a.downloads);
                if(store.filter.sort === 'rating') hits.sort((a,b) => b.rating - a.rating);

                if(hits.length === 0) {
                    results.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-sub)">No matches found</div>`;
                    return;
                }

                results.innerHTML = hits.map(app => `
                    <div style="display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);" onclick="window.location.hash='#details?id=${app.id}'; document.getElementById('searchModal').classList.remove('active');">
                        <img src="${app.icon}" style="width:48px; height:48px; border-radius:10px;">
                        <div>
                            <div style="font-weight:600; font-size:0.95rem">${app.name.replace(regex, '<mark>$1</mark>')}</div>
                            <div style="font-size:0.8rem; color:var(--text-sub)">${app.category} • v${app.version}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // ==========================================
        // DATA & ROUTING
        // ==========================================
        const ui = new UI();

        // Router
        async function handleRoute() {
            const hash = window.location.hash;
            const menuBtn = document.getElementById('menuBtn');
            const mainHeader = document.getElementById('mainHeader');

            // Scroll Handling
            window.scrollTo(0, 0);

            // Conditional Header Button
            if (!hash || hash === '#') {
                menuBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
                menuBtn.onclick = () => ui.toggleSidebar(true);
            } else {
                menuBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i>';
                menuBtn.onclick = () => window.history.back();
            }

            // Waiting for data
            if(store.apps.length === 0) {
                ui.renderLoader();
                await fetchApps();
            }

            if (!hash || hash === '#') {
                ui.transitionTo(ui.renderHome(store.apps));
            } 
            else if (hash.startsWith('#details')) {
                const id = new URLSearchParams(hash.split('?')[1]).get('id');
                const app = store.apps.find(a => a.id === id);
                if (app) ui.transitionTo(ui.renderDetails(app));
                else ui.transitionTo(`<div class="container"><p>App not found.</p></div>`);
            } 
            else if (hash.startsWith('#category')) {
                const name = new URLSearchParams(hash.split('?')[1]).get('name');
                const filtered = store.apps.filter(a => a.category === name);
                ui.transitionTo(ui.renderListing(name, filtered));
            } 
            else if (hash === '#popular') {
                const sorted = [...store.apps].sort((a,b) => b.downloads - a.downloads);
                ui.transitionTo(ui.renderListing("Trending Apps", sorted));
            }
            else if (hash === '#latest') {
                const sorted = [...store.apps].sort((a,b) => b.timestamp - a.timestamp);
                ui.transitionTo(ui.renderListing("Latest Uploads", sorted));
            }
        }

        // Fetch Data
        function fetchApps() {
            return new Promise((resolve) => {
                const appsRef = ref(db, 'apps');
                onValue(appsRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        store.apps = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    }
                    resolve();
                }, (error) => {
                    console.error(error);
                    resolve(); // Resolve anyway to avoid infinite load
                });
            });
        }

        // Init
        window.addEventListener('hashchange', handleRoute);
        // Initial call
        handleRoute();

        // Hide Header on scroll down (Micro interaction)
        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            const header = document.querySelector('.header');
            if (currentScroll > lastScroll && currentScroll > 60) {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }
            lastScroll = currentScroll;
        });

    </script>
</body>
</html>
